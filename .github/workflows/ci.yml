name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-y-arquitectura:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar
        # tsc -b y despues vite build: el chequeo de tipos es parte del build.
        run: npm run build

      - name: Limites de la arquitectura
        # Sin este paso las reglas entre modulos dependen de que alguien se acuerde
        # de correrlas. Aca las rompe el pipeline.
        run: npm run arch
